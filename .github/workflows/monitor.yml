name: Relay Model Health Monitor

on:
  workflow_dispatch:
    inputs:
      push_wechat:
        description: "立即推送完整巡检报告到微信"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  schedule:
    # 每 15 分钟自动云端巡检一次 (UTC 时间，对应 GitHub Actions 免费额度)
    - cron: "*/15 * * * *"

jobs:
  check-models:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore previous monitor state
        uses: actions/cache@v4
        with:
          path: .state
          key: relay-monitor-state-${{ github.run_id }}
          restore-keys: |
            relay-monitor-state-

      - name: Generate runtime config from Secrets
        env:
          RELAY_BASE_URL: ${{ secrets.RELAY_BASE_URL }}
          RELAY_TOKEN: ${{ secrets.RELAY_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          if [ -z "$RELAY_BASE_URL" ] || [ -z "$RELAY_TOKEN" ]; then
            echo "❌ 缺少 RELAY_BASE_URL 或 RELAY_TOKEN！请在仓库 Settings -> Secrets and variables -> Actions 中配置。"
            exit 1
          fi
          python3 -c '
          import json, os
          with open("config.example.json", "r", encoding="utf-8") as f:
              cfg = json.load(f)
          cfg["base_url"] = os.environ["RELAY_BASE_URL"].rstrip("/")
          cfg["token"] = os.environ["RELAY_TOKEN"]
          if os.environ.get("SERVERCHAN_KEY"):
              cfg["serverchan_sendkey"] = os.environ["SERVERCHAN_KEY"]
          with open("config.json", "w", encoding="utf-8") as f:
              json.dump(cfg, f, ensure_ascii=False, indent=2)
          '

      - name: Run model health check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.push_wechat }}" = "true" ]; then
            python3 scripts/relay_cli.py check --push
          else
            # 定时巡检仅在 GLM 恢复 (RECOVERED) 或全线宕机 (ALL_DOWN) 时推送微信
            python3 scripts/relay_cli.py poll-step
          fi
